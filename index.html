<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ── マスターデータ ─────────────────────────────────────────
    const ALL_CLASSES = [
      '1-1','1-2','1-3','1-4',
      '2-1','2-2','2-3','2-4',
      '3-1','3-2','3-3','3-4',
      'さぽ','全体',
    ];
    const ALL_SUBJECTS = [

      '音楽','美術','体育','技術','家庭',
      '道徳','総合','特活','LHR','自習','その他',
    ];
    const DAYS     = ['月','火','水','木','金'];
    const DAY_KEYS = ['mon','tue','wed','thu','fri'];
    const PERIODS  = [1,2,3,4,5,6];
    const DOW_JP   = ['日','月','火','水','木','金','土'];

    const SUB_STYLE = {
      '国語': { cell:'bg-red-50',    badge:'bg-red-100 text-red-700'         },
      '数学': { cell:'bg-blue-50',   badge:'bg-blue-100 text-blue-700'       },
      '英語': { cell:'bg-green-50',  badge:'bg-green-100 text-green-700'     },
      '理科': { cell:'bg-emerald-50',badge:'bg-emerald-100 text-emerald-700' },
      '社会': { cell:'bg-yellow-50', badge:'bg-yellow-100 text-yellow-700'   },
      '音楽': { cell:'bg-purple-50', badge:'bg-purple-100 text-purple-700'   },
      '美術': { cell:'bg-pink-50',   badge:'bg-pink-100 text-pink-700'       },
      '体育': { cell:'bg-orange-50', badge:'bg-orange-100 text-orange-700'   },
      '技術': { cell:'bg-slate-50',  badge:'bg-slate-100 text-slate-600'     },
      '家庭': { cell:'bg-rose-50',   badge:'bg-rose-100 text-rose-700'       },
      '道徳': { cell:'bg-indigo-50', badge:'bg-indigo-100 text-indigo-700'   },
      '総合': { cell:'bg-teal-50',   badge:'bg-teal-100 text-teal-700'       },
      '特活': { cell:'bg-cyan-50',   badge:'bg-cyan-100 text-cyan-700'       },
      'LHR':  { cell:'bg-violet-50', badge:'bg-violet-100 text-violet-700'   },
      '自習': { cell:'bg-gray-50',   badge:'bg-gray-100 text-gray-500'       },

    };

    // 学期ごとのカラー設定
    const TERM_STYLE = [
      { name:'1学期', active:'text-blue-600   border-blue-500',   btn:'bg-blue-600   hover:bg-blue-700',   icon:'bg-blue-500'   },
      { name:'2学期', active:'text-violet-600 border-violet-500', btn:'bg-violet-600 hover:bg-violet-700', icon:'bg-violet-500' },
      { name:'3学期', active:'text-teal-600   border-teal-500',   btn:'bg-teal-600   hover:bg-teal-700',   icon:'bg-teal-500'   },
    ];

    const DEFAULT_SETTINGS = {
      myClasses:  [],
      mySubjects: [],
      terms: [
        { name:'1学期', start:'', end:'' },
        { name:'2学期', start:'', end:'' },
        { name:'3学期', start:'', end:'' },
      ],
    };

    const DEFAULT_ANNUAL = {
      dayRecords: [],
      // [{ id, date:'YYYY-MM-DD', dailySchedule:'', events:'' }]
    };

    // 1〜3学期それぞれのベース時間割
    const DEFAULT_TIMETABLE = {
      term1: { periods: {} },
      term2: { periods: {} },
      term3: { periods: {} },
      // periods: { 1: { mon:{className,subject,unit}, tue:…, … }, 2:{…}, … }
    };

    // ── ユーティリティ ─────────────────────────────────────────
    function getMonday(d) {
      const date = new Date(d);
      const day  = date.getDay();
      date.setDate(date.getDate() - (day === 0 ? 6 : day - 1));
      date.setHours(0, 0, 0, 0);
      return date;
    }
    function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
    function wkey(monday) {
      return `${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`;
    }
    function toDateStr(date) {
      return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    }
    function fmd(d) { return `${d.getMonth()+1}/${d.getDate()}`; }
    function isToday(d) {
      const t = new Date();
      return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
    }
    function getCurrentTerm(monday, terms) {
      const key = wkey(monday);
      return terms.find(t => t.start && t.end && key >= t.start && key <= t.end) || null;
    }
    function isSettingsReady(s) { return s.myClasses.length > 0 && s.mySubjects.length > 0; }
    function genId() { return Math.random().toString(36).slice(2,10); }
    function getDayRecord(dateStr, dayRecords) {
      return dayRecords.find(r => r.date === dateStr) || null;
    }
    function fmtDateLabel(dateStr) {
      const [y,m,d] = dateStr.split('-').map(Number);
      const dow = new Date(y, m-1, d).getDay();
      return `${m}/${d}（${DOW_JP[dow]}）`;
    }
    function fmtMonthLabel(monthStr) {
      const [y,m] = monthStr.split('-').map(Number);
      return `${y}年 ${m}月`;
    }
    // 学期内の月曜日リストを返す
    function getWeeksInTerm(term) {
      if (!term?.start || !term?.end) return [];
      const end = new Date(term.end + 'T00:00:00');
      const weeks = [];
      let cur = getMonday(new Date(term.start + 'T00:00:00'));
      while (cur <= end) { weeks.push(wkey(cur)); cur = addDays(cur, 7); }
      return weeks;
    }

    // ── CSV パーサー ───────────────────────────────────────────
    function parseCSVLine(line) {
      const cols = []; let cur = ''; let inQ = false;
      for (const ch of line) {
        if (ch === '"') { inQ = !inQ; }
        else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
        else { cur += ch; }
      }
      cols.push(cur);
      return cols.map(c => c.trim());
    }
    function parseDateStr(raw) {
      const s = raw.trim().replace(/\//g,'-').replace(/年|月/g,'-').replace(/日/g,'');
      const full  = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (full)  return `${full[1]}-${full[2].padStart(2,'0')}-${full[3].padStart(2,'0')}`;
      const short = s.match(/^(\d{1,2})-(\d{1,2})$/);
      if (short) return `${new Date().getFullYear()}-${short[1].padStart(2,'0')}-${short[2].padStart(2,'0')}`;
      return null;
    }
    function parseCSV(text) {
      const lines = text.replace(/^\uFEFF/,'').split(/\r?\n/);
      const records = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const cols = parseCSVLine(line);
        const date = parseDateStr(cols[0] || '');
        if (!date) continue;
        records.push({ id:genId(), date, dailySchedule:(cols[1]||'').trim(), events:(cols[2]||'').trim() });
      }
      return records.sort((a,b) => a.date.localeCompare(b.date));
    }
    function downloadTemplateCsv() {
      const bom  = '\uFEFF';
      const rows = [
        '日付,日課,行事',
        '2026/4/13,A5掃学,登校指導①（教員）/避難訓練/部活動見学②',
        '2026/4/14,A6×学,仮入部①/時間割試行/初任研１（集合）/共同実施',
        '2026/4/15,B5掃×,全体研修会/郡教振理事/郡研究所運委会',
        '2026/4/16,B5××,耳鼻科健診/中体連専門部会/町総合教育会議',
        '2026/4/17,B6掃学,認証式/専門委員会/町国際化対応担当者会',
      ].join('\n');
      const blob = new Blob([bom+rows], {type:'text/csv;charset=utf-8;'});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url; a.download = '週案_年間行事日課_テンプレート.csv'; a.click();
      URL.revokeObjectURL(url);
    }

    // ── Flash helper（共通） ───────────────────────────────────
    function Flash({ msg }) {
      if (!msg) return null;
      return (
        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-green-600 text-white px-6 py-3 rounded-2xl shadow-lg font-semibold text-sm no-print pointer-events-none">
          ✓ {msg}
        </div>
      );
    }
    function useFlash() {
      const [msg, setMsg] = useState('');
      const show = (m) => { setMsg(m); setTimeout(() => setMsg(''), 2800); };
      return [msg, show];
    }

    // ── InlineEditor ───────────────────────────────────────────
    function InlineEditor({ value, onChange, autoValue='', placeholder, multiline, className }) {
      const [editing, setEditing] = useState(false);
      const [draft,   setDraft  ] = useState('');
      const isAuto    = !value && !!autoValue;
      const displayed = value || autoValue;
      const startEditing = () => { setDraft(displayed); setEditing(true); };
      const commit = () => { onChange(draft); setEditing(false); };
      const cancel = () => { setEditing(false); };
      if (!editing) {
        return (
          <div onClick={startEditing}
            title={isAuto ? '年間データから自動反映（クリックで変更）' : undefined}
            className={`cursor-text p-2 min-h-[40px] text-xs whitespace-pre-wrap
              ${className} ${!displayed?'text-gray-300 italic':''} ${isAuto?'opacity-55':''}`}>
            {displayed || placeholder}
          </div>
        );
      }
      const shared = {
        value:draft, onChange:e=>setDraft(e.target.value), onBlur:commit,
        onKeyDown:e=>{ if(e.key==='Escape') cancel(); if(!multiline&&e.key==='Enter') commit(); },
        autoFocus:true, className:`w-full p-2 text-xs focus:outline-none bg-white/90 ${className}`,
      };
      return multiline
        ? <textarea rows={3} style={{resize:'none'}} {...shared}/>
        : <input type="text" {...shared}/>;
    }

    // ── PeriodCell ─────────────────────────────────────────────
    function PeriodCell({ cell, today, onClick }) {
      const st    = SUB_STYLE[cell?.subject] || {};
      const empty = !cell?.className && !cell?.subject && !cell?.unit;
      return (
        <div onClick={onClick}
          className={`min-h-[76px] p-2 cursor-pointer cell-hover transition-all
            ${st.cell||'bg-white'} ${today?'ring-2 ring-inset ring-blue-300':''}`}>
          {empty
            ? <div className="h-full min-h-[60px] flex items-center justify-center text-gray-200 text-lg select-none">＋</div>
            : <div className="space-y-1">
                {cell.className && <div className="font-bold text-gray-800 text-sm leading-none">{cell.className}</div>}
                {cell.subject && <span className={`inline-block text-xs px-1.5 py-0.5 rounded font-semibold ${st.badge||'bg-gray-100 text-gray-600'}`}>{cell.subject}</span>}
                {cell.unit && <div className="text-xs text-gray-600 leading-tight" style={{display:'-webkit-box',WebkitLineClamp:3,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{cell.unit}</div>}
              </div>
          }
        </div>
      );
    }

    // ── PeriodModal ────────────────────────────────────────────
    function PeriodModal({ period, dayIdx, cell, classes, subjects, onSave, onClear, onClose }) {
      const [form, setForm] = useState({
        className:cell?.className||'', subject:cell?.subject||'', unit:cell?.unit||'',
      });
      useEffect(() => {
        const h = e => { if (e.key==='Escape') onClose(); };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [onClose]);
      const tog = (field, val) => setForm(f => ({...f, [field]:f[field]===val?'':val}));
      return (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
          onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div className="bg-gradient-to-r from-blue-600 to-blue-500 px-6 py-4 flex items-center justify-between text-white">
              <h2 className="font-bold text-lg">{DAYS[dayIdx]}曜日　{period}限</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-xl">✕</button>
            </div>
            <div className="p-6 space-y-5">
              <div>
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">クラス</p>
                <div className="flex flex-wrap gap-2">
                  {classes.map(c => (
                    <button key={c} onClick={() => tog('className',c)}
                      className={`px-3 py-1.5 rounded-lg text-sm font-semibold border-2 transition-all
                        ${form.className===c?'bg-blue-600 text-white border-blue-600':'bg-gray-50 text-gray-600 border-gray-100 hover:border-blue-300'}`}>
                      {c}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">教科</p>
                <div className="flex flex-wrap gap-2">
                  {subjects.map(s => {
                    const st=SUB_STYLE[s]||{}; const sel=form.subject===s;
                    return (
                      <button key={s} onClick={() => tog('subject',s)}
                        className={`px-3 py-1.5 rounded-lg text-sm font-semibold border-2 transition-all
                          ${sel?`${st.badge} border-current`:'bg-gray-50 text-gray-600 border-gray-100 hover:border-gray-300'}`}>
                        {s}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div>
                <p className="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">単元・内容</p>
                <input type="text" autoFocus
                  className="w-full border-2 border-gray-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 transition"
                  placeholder="単元名や授業内容（省略可）"
                  value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))}
                  onKeyDown={e=>{ if(e.key==='Enter') onSave(form); }}
                />
              </div>
            </div>
            <div className="px-6 pb-6 flex gap-3">
              <button onClick={()=>onSave(form)} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">保存</button>
              <button onClick={onClear} className="px-5 py-3 rounded-xl font-medium border-2 border-gray-200 text-gray-400 hover:bg-gray-50 transition">クリア</button>
            </div>
          </div>
        </div>
      );
    }

    // ── TopNav ─────────────────────────────────────────────────
    function TopNav({ view, setView, ready }) {
      const tabs = [
        { key:'main',      label:'📅 週案',          short:'週案'    },
        { key:'timetable', label:'🗓 時間割',         short:'時間割'  },
        { key:'annual',    label:'📋 年間行事・日課',  short:'行事'    },
        { key:'stats',     label:'📊 集計',           short:'集計'    },
        { key:'settings',  label:'⚙️ 設定', warn:!ready, short:'設定' },
      ];
      return (
        <nav className="bg-white border-b border-gray-200 no-print sticky top-0 z-40 shadow-sm">
          {/* ── PC: 1行レイアウト ── */}
          <div className="px-4 py-3 flex items-center justify-between">
            <div className="flex items-center gap-3 shrink-0">
              <div className="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center shadow-sm">
                <span className="text-white font-black text-sm">週</span>
              </div>
              <span className="font-bold text-gray-800 text-base tracking-tight hidden sm:block">週案アプリ</span>
            </div>
            {/* デスクトップ用タブ（sm以上） */}
            <div className="hidden sm:flex gap-1 bg-gray-100 p-1 rounded-xl">
              {tabs.map(tab => (
                <button key={tab.key} onClick={() => setView(tab.key)}
                  className={`relative px-3 py-1.5 rounded-lg text-sm font-semibold transition-all whitespace-nowrap
                    ${view===tab.key?'bg-white text-blue-600 shadow-sm':'text-gray-500 hover:text-gray-700'}`}>
                  {tab.label}
                  {tab.warn && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-400 rounded-full border-2 border-white"/>}
                </button>
              ))}
            </div>
            {/* モバイル：現在のページ名 */}
            <span className="sm:hidden text-sm font-bold text-blue-600">
              {tabs.find(t=>t.key===view)?.label}
            </span>
          </div>
          {/* ── モバイル用タブバー（sm未満） ── */}
          <div className="sm:hidden flex border-t border-gray-100 overflow-x-auto">
            {tabs.map(tab => (
              <button key={tab.key} onClick={() => setView(tab.key)}
                className={`relative flex-1 min-w-[60px] py-2.5 text-xs font-bold whitespace-nowrap border-b-2 transition-all
                  ${view===tab.key?'text-blue-600 border-blue-500 bg-blue-50/40':'text-gray-400 border-transparent'}`}>
                {tab.short}
                {tab.warn && <span className="absolute top-1 right-1 w-2 h-2 bg-red-400 rounded-full border border-white"/>}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    // ── TimetableView（ベース時間割） ──────────────────────────
    function TimetableView({ timetable, setTimetable, settings, allData, setAllData }) {
      const [activeTerm,  setActiveTerm ] = useState(0);
      const [modal,       setModal      ] = useState(null);
      const [confirmReg,  setConfirmReg ] = useState(null); // termIdx
      const [regMode,     setRegMode    ] = useState('empty');
      const [showClear,   setShowClear  ] = useState(false);
      const [flashMsg,    showFlash     ] = useFlash();

      const termKey  = `term${activeTerm+1}`;
      const termData = timetable[termKey] || { periods:{} };
      const termInfo = settings.terms[activeTerm];
      const hasDate  = !!(termInfo?.start && termInfo?.end);
      const classes  = settings.myClasses.length  > 0 ? settings.myClasses  : ALL_CLASSES;
      const subjects = settings.mySubjects.length > 0 ? settings.mySubjects : ALL_SUBJECTS;

      const weekCount = hasDate ? getWeeksInTerm(termInfo).length : 0;

      const getCell = (period, dayKey) => termData.periods?.[period]?.[dayKey] || null;

      const setCell = (period, dayKey, cell) =>
        setTimetable(t => ({
          ...t,
          [termKey]: {
            ...(t[termKey]||{}),
            periods: {
              ...(t[termKey]?.periods||{}),
              [period]: { ...(t[termKey]?.periods?.[period]||{}), [dayKey]: cell },
            },
          },
        }));

      // 他の学期からコピー
      const copyFromTerm = (fromIdx) => {
        const fromKey  = `term${fromIdx+1}`;
        const fromData = timetable[fromKey]?.periods || {};
        setTimetable(t => ({
          ...t,
          [termKey]: { periods: JSON.parse(JSON.stringify(fromData)) },
        }));
        showFlash(`${settings.terms[fromIdx].name}の時間割をコピーしました`);
      };

      // この学期をクリア
      const clearTerm = () => {
        setTimetable(t => ({ ...t, [termKey]: { periods:{} } }));
        setShowClear(false);
        showFlash('この学期の時間割をクリアしました');
      };

      // 週案への一括登録
      const registerToWeeks = () => {
        const termIdx = confirmReg;
        const term    = settings.terms[termIdx];
        const ttKey   = `term${termIdx+1}`;
        const ttPeriods = timetable[ttKey]?.periods || {};
        const weeks   = getWeeksInTerm(term);

        setAllData(prev => {
          const updated = { ...prev };
          for (const wk of weeks) {
            const existing      = updated[wk] || {};
            const existPeriods  = existing.periods || {};
            const newPeriods    = {};

            for (const period of PERIODS) {
              newPeriods[period] = { ...(existPeriods[period]||{}) };
              for (const dayKey of DAY_KEYS) {
                const baseCell = ttPeriods[period]?.[dayKey];
                if (regMode === 'empty' && newPeriods[period][dayKey]) continue; // 空欄のみ
                newPeriods[period][dayKey] = baseCell ? { ...baseCell } : null;
              }
            }
            updated[wk] = { ...existing, periods: newPeriods };
          }
          return updated;
        });

        setConfirmReg(null);
        showFlash(`${term.name}（${weeks.length}週分）を週案に一括登録しました`);
      };

      return (
        <div className="max-w-5xl mx-auto py-6 px-4 space-y-4">
          <Flash msg={flashMsg} />

          <div className="bg-white rounded-2xl shadow-lg overflow-hidden">

            {/* ── ヘッダー ── */}
            <div className="bg-gradient-to-r from-gray-700 to-gray-600 px-6 py-4 text-white flex items-center justify-between">
              <div>
                <p className="text-gray-300 text-xs font-semibold tracking-widest uppercase mb-0.5">Base Timetable</p>
                <h1 className="text-xl font-bold">ベース時間割</h1>
              </div>
              <p className="text-gray-400 text-xs text-right">学期ごとの基本時間割を入力し<br/>週案へ一括登録できます</p>
            </div>

            {/* ── 学期タブ ── */}
            <div className="flex border-b border-gray-100">
              {settings.terms.map((term, idx) => {
                const active = activeTerm === idx;
                const ts     = TERM_STYLE[idx];
                const hasD   = !!(term.start && term.end);
                return (
                  <button key={idx} onClick={() => setActiveTerm(idx)}
                    className={`flex-1 py-3 px-4 text-sm font-bold transition-all border-b-2 flex flex-col items-center gap-0.5

            return (

                onClick={e=>{ if(e.target===e.currentTarget) setConfirmReg(null); }}>
                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                  <div className="bg-gradient-to-r from-gray-700 to-gray-600 px-6 py-4 text-white flex items-center justify-between">
                    <h2 className="font-bold text-lg">📅 一括登録の確認</h2>

          {/* ── セル編集モーダル ── */}

              onSave={form => { setCell(modal.period, modal.dayKey, form); setModal(null); }}

              onClose={()  => setModal(null)}
            />

        </div>
      );

    // ── CsvImportModal ─────────────────────────────────────────
    function CsvImportModal({ onImport, onClose }) {
      const [parsed,   setParsed  ] = useState([]);
      const [error,    setError   ] = useState('');
      const [mode,     setMode    ] = useState('merge');
      const [encoding, setEncoding] = useState('UTF-8');
      const [dragging, setDragging] = useState(false);
      const fileRef = useRef();

      useEffect(() => {
        const h = e => { if(e.key==='Escape') onClose(); };
        window.addEventListener('keydown',h);
        return () => window.removeEventListener('keydown',h);
      },[]);

      const processFile = (file) => {
        if (!file) return;
        setParsed([]); setError('');
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const records = parseCSV(e.target.result);
            if (!records.length) { setError('有効なデータが見つかりませんでした。フォーマット・文字コードを確認してください。'); }
            else setParsed(records);
          } catch { setError('ファイルの読み込みに失敗しました。'); }
        };
        reader.readAsText(file, encoding);
      };

      return (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
          onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div className="bg-gradient-to-r from-blue-600 to-blue-500 px-6 py-4 flex items-center justify-between text-white shrink-0">
              <h2 className="font-bold text-lg">📂 CSVインポート</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-xl">✕</button>
            </div>
            <div className="flex-1 overflow-y-auto p-6 space-y-5">
              {/* フォーマット説明 */}
              <div className="bg-blue-50 rounded-xl p-4 text-xs text-blue-800 space-y-1">
                <p className="font-bold text-sm mb-1">📄 CSVフォーマット（3列）</p>
                <div className="font-mono bg-white/70 rounded-lg p-3 leading-relaxed">
                  <span className="text-gray-400">日付,日課,行事</span><br/>
                  2026/4/13,A5掃学,登校指導①/避難訓練<br/>
                  2026/4/14,A6×学,仮入部①/時間割試行
                </div>
                <button onClick={downloadTemplateCsv}
                  className="mt-1 text-blue-600 hover:text-blue-800 font-semibold underline">
                  ⬇ テンプレートをダウンロード
                </button>
              </div>
              {/* 文字コード */}
              <div className="flex items-center gap-4">
                <span className="text-sm font-semibold text-gray-600 shrink-0">文字コード：</span>
                {['UTF-8','Shift_JIS'].map(enc => (
                  <label key={enc} className="flex items-center gap-1.5 cursor-pointer">
                    <input type="radio" name="enc" value={enc} checked={encoding===enc}
                      onChange={() => { setEncoding(enc); setParsed([]); setError(''); }} className="accent-blue-600"/>
                    <span className="text-sm text-gray-700">{enc==='UTF-8'?'UTF-8（Mac / Google スプレッドシート）':'Shift-JIS（Windows Excel）'}</span>
                  </label>
                ))}
              </div>
              {/* ドロップエリア */}
              <div onClick={() => fileRef.current?.click()}
                onDrop={e=>{ e.preventDefault(); setDragging(false); processFile(e.dataTransfer.files[0]); }}
                onDragOver={e=>{ e.preventDefault(); setDragging(true); }}
                onDragLeave={() => setDragging(false)}
                className={`border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer transition-all
                  ${dragging?'border-blue-400 bg-blue-50':'border-gray-200 hover:border-blue-300 hover:bg-gray-50'}`}>
                <div className="text-4xl mb-2">{dragging?'📥':'📂'}</div>
                <p className="font-semibold text-gray-600 text-sm">クリックまたはドラッグ＆ドロップ</p>
                <p className="text-xs text-gray-400 mt-1">CSVファイル (.csv)</p>
                <input ref={fileRef} type="file" accept=".csv,text/csv" hidden
                  onChange={e=>processFile(e.target.files[0])}/>
              </div>
              {error && <div className="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-sm text-red-700">⚠ {error}</div>}
              {parsed.length > 0 && (
                <div className="space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="font-bold text-gray-700">{parsed.length}件 読み込み完了</span>
                    {parsed.length>8 && <span className="text-xs text-gray-400">（先頭8件を表示）</span>}
                  </div>
                  <div className="border border-gray-100 rounded-xl overflow-hidden text-sm">
                    <div className="grid grid-cols-[120px_100px_1fr] bg-gray-50 text-xs font-semibold text-gray-500 px-3 py-2 border-b border-gray-100">
                      <span>日付</span><span>日課</span><span>行事</span>
                    </div>
                    {parsed.slice(0,8).map((r,i) => (
                      <div key={i} className={`grid grid-cols-[120px_100px_1fr] px-3 py-2 text-xs gap-2 ${i%2===0?'bg-white':'bg-gray-50/50'}`}>
                        <span className="font-semibold text-amber-700">{fmtDateLabel(r.date)}</span>
                        <span className="font-semibold text-blue-700">{r.dailySchedule||'—'}</span>
                        <span className="text-gray-700 truncate">{r.events||'—'}</span>
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-4 p-4 bg-gray-50 rounded-xl">
                    {[
                      { key:'merge',   label:'既存に追加・同日は上書き', desc:'同じ日付は新しいデータで上書き' },
                      { key:'replace', label:'全て置き換え',             desc:'既存データを全削除してから取り込む' },
                    ].map(opt => (
                      <label key={opt.key} className="flex items-start gap-2 cursor-pointer flex-1">
                        <input type="radio" name="mode" value={opt.key} checked={mode===opt.key}
                          onChange={() => setMode(opt.key)} className="accent-blue-600 mt-0.5 shrink-0"/>
                        <div>
                          <p className="text-sm font-semibold text-gray-700">{opt.label}</p>
                          <p className="text-xs text-gray-400 mt-0.5">{opt.desc}</p>
                        </div>
                      </label>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div className="px-6 py-4 border-t border-gray-100 flex gap-3 shrink-0">
              {parsed.length>0 && (
                <button onClick={() => onImport(parsed, mode)}
                  className="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition">
                  {parsed.length}件をインポート
                </button>
              )}
              <button onClick={onClose}
                className="px-6 py-3 rounded-xl font-medium border-2 border-gray-200 text-gray-500 hover:bg-gray-50 transition">
                キャンセル
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── AnnualView ─────────────────────────────────────────────
    function AnnualView({ annualData, setAnnualData }) {
      const [newDate,     setNewDate    ] = useState('');
      const [newSchedule, setNewSchedule] = useState('');
      const [newEvents,   setNewEvents  ] = useState('');
      const [showImport,  setShowImport ] = useState(false);
      const [showClear,   setShowClear  ] = useState(false);
      const [flashMsg,    showFlash     ] = useFlash();

      const addRecord = () => {
        if (!newDate) return;
        const record = { id:genId(), date:newDate, dailySchedule:newSchedule.trim(), events:newEvents.trim() };
        setAnnualData(d => {
          const rest = d.dayRecords.filter(r => r.date!==newDate);
          return { ...d, dayRecords:[...rest,record].sort((a,b)=>a.date.localeCompare(b.date)) };
        });
        setNewSchedule(''); setNewEvents('');
        showFlash('追加しました');
      };

      const removeRecord = id =>
        setAnnualData(d => ({ ...d, dayRecords:d.dayRecords.filter(r=>r.id!==id) }));

      const importRecords = (records, mode) => {
        setAnnualData(d => {
          if (mode==='replace') return { ...d, dayRecords:records };
          const filtered = d.dayRecords.filter(r => !records.some(nr=>nr.date===r.date));
          return { ...d, dayRecords:[...filtered,...records].sort((a,b)=>a.date.localeCompare(b.date)) };
        });
        setShowImport(false);
        showFlash(`${records.length}件をインポートしました`);
      };

      const clearAll = () => {
        setAnnualData(d => ({ ...d, dayRecords:[] }));
        setShowClear(false);
        showFlash('全件削除しました');
      };

      const byMonth = {};
      annualData.dayRecords.forEach(r => {
        const m = r.date.slice(0,7);
        if (!byMonth[m]) byMonth[m]=[];
        byMonth[m].push(r);
      });
      const total = annualData.dayRecords.length;

      return (
        <div className="max-w-4xl mx-auto py-8 px-4 space-y-6">
          <Flash msg={flashMsg}/>
          {/* 操作エリア */}
          <div className="flex flex-wrap gap-2 items-center">
            <button onClick={() => setShowImport(true)}
              className="flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition shadow-sm">
              📂 CSVインポート
            </button>
            <button onClick={downloadTemplateCsv}
              className="flex items-center gap-2 px-5 py-2.5 bg-white hover:bg-gray-50 text-gray-700 rounded-xl text-sm font-semibold border-2 border-gray-200 transition">
              ⬇ テンプレートDL
            </button>
            {total > 0 && <>
              <button onClick={() => setShowClear(true)}
                className="px-4 py-2.5 text-red-500 hover:bg-red-50 rounded-xl text-sm font-semibold border-2 border-red-100 transition ml-auto">
                🗑 全件削除
              </button>
              <span className="text-sm text-gray-400 font-medium">{total}件登録済み</span>
            </>}
          </div>

          {/* 1件追加フォーム */}
          <section className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="px-6 py-4 bg-gradient-to-r from-amber-50 to-white border-b border-gray-100 flex items-center gap-3">
              <div className="w-9 h-9 bg-amber-100 rounded-xl flex items-center justify-center text-lg">✏️</div>
              <div>
                <h2 className="font-bold text-gray-800">1件追加・上書き</h2>
                <p className="text-xs text-gray-400 mt-0.5">日付・日課・行事をセットで登録。同じ日付を追加すると上書きされます</p>
              </div>
            </div>
            <div className="p-4 sm:p-6">
              <div className="grid grid-cols-1 sm:grid-cols-[160px_130px_1fr_auto] gap-3 items-end">
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">日付 <span className="text-red-400">*</span></label>
                  <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)}
                    className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400 transition"/>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">日課</label>
                  <input type="text" value={newSchedule} onChange={e=>setNewSchedule(e.target.value)}
                    placeholder="例: A5掃学"
                    className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400 transition font-semibold text-blue-700"/>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 mb-1">行事</label>
                  <input type="text" value={newEvents} onChange={e=>setNewEvents(e.target.value)}
                    placeholder="行事名（なければ空欄可）"
                    onKeyDown={e=>{ if(e.key==='Enter') addRecord(); }}
                    className="w-full border-2 border-gray-100 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-amber-400 transition"/>
                </div>
                <button onClick={addRecord} disabled={!newDate}
                  className="w-full sm:w-auto px-5 py-2.5 bg-amber-500 hover:bg-amber-600 disabled:opacity-40 text-white rounded-xl text-sm font-bold transition">
                  ＋ 追加
                </button>
              </div>
            </div>
          </section>

          {/* 登録済みリスト */}
          <section className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="px-6 py-4 bg-gradient-to-r from-blue-50 to-white border-b border-gray-100 flex items-center gap-3">
              <div className="w-9 h-9 bg-blue-100 rounded-xl flex items-center justify-center text-lg">📋</div>
              <div>
                <h2 className="font-bold text-gray-800">登録済みデータ</h2>
                <p className="text-xs text-gray-400 mt-0.5">週案の「行事」「日課」欄に自動反映（薄い表示＝自動反映中）</p>
              </div>
            </div>
            {total === 0
              ? <div className="py-16 text-center text-gray-300">
                  <div className="text-5xl mb-3">📭</div>
                  <p className="font-semibold">データがまだ登録されていません</p>
                  <p className="text-xs mt-1">CSVインポートまたは1件追加から登録してください</p>
                </div>
              : <div className="divide-y divide-gray-50">
                  <div className="hidden sm:grid grid-cols-[140px_110px_1fr_44px] px-6 py-2 bg-gray-50 text-xs font-semibold text-gray-400 uppercase tracking-wide">
                    <span>日付</span><span>日課</span><span>行事</span><span/>
                  </div>
                  {Object.entries(byMonth).map(([month, records]) => (
                    <div key={month}>
                      <div className="px-6 py-2 bg-gradient-to-r from-gray-50 to-white border-b border-gray-100">
                        <span className="text-xs font-bold text-gray-400 tracking-widest">{fmtMonthLabel(month)}</span>
                        <span className="text-xs text-gray-300 ml-2">{records.length}件</span>
                      </div>
                      {records.map(r => (

    // ── WeeklyPlanView ─────────────────────────────────────────
    function WeeklyPlanView({ settings, annualData, setView, allData, setAllData }) {
      const [monday, setMonday] = useState(() => getMonday(new Date()));
      const [modal,  setModal ] = useState(null);

      const wk       = wkey(monday);
      const dates    = DAY_KEYS.map((_,i) => addDays(monday,i));
      const data     = allData[wk] || {};
      const classes  = settings.myClasses.length  > 0 ? settings.myClasses  : ALL_CLASSES;
      const subjects = settings.mySubjects.length > 0 ? settings.mySubjects : ALL_SUBJECTS;
      const term     = getCurrentTerm(monday, settings.terms);
      const ready    = isSettingsReady(settings);

      const patch = useCallback(updates => {
        setAllData(p => ({ ...p, [wk]:{ ...(p[wk]||{}), ...updates } }));
      }, [wk]);
      const getCell = (period, dayKey) => data.periods?.[period]?.[dayKey] || null;
      const setCell = useCallback((period, dayKey, cell) => {
        setAllData(p => {
          const wd = p[wk]||{};
          return { ...p, [wk]:{ ...wd, periods:{ ...(wd.periods||{}),
            [period]:{ ...(wd.periods?.[period]||{}), [dayKey]:cell } } } };
        });
      }, [wk]);

      const prevWk  = () => setMonday(m => addDays(m,-7));
      const nextWk  = () => setMonday(m => addDays(m,+7));
      const todayWk = () => setMonday(getMonday(new Date()));

      const patchEvent = (dayKey, v) => {
        const ev = { ...(data.events||{}) };
        if (!v) delete ev[dayKey]; else ev[dayKey]=v;
        patch({ events:ev });
      };
      const patchSchedule = (dayKey, v) => {
        const ds = { ...(data.dailySchedule||{}) };
        if (!v) delete ds[dayKey]; else ds[dayKey]=v;
        patch({ dailySchedule:ds });
      };

      return (
        <div className="min-h-screen bg-slate-100 py-6 px-2 sm:px-4">
          <div className="max-w-6xl mx-auto">

              </div>

                <div className="flex gap-2 items-center">

                  <button onClick={todayWk} className="flex-1 sm:flex-none px-3 sm:px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-sm font-semibold transition">今週</button>
                  <button onClick={nextWk}  className="flex-1 sm:flex-none px-3 sm:px-4 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-sm font-semibold transition">次週 →</button>

                    <tr className="border-b-2 border-gray-100">
                      <th className="p-2 text-xs text-gray-400 font-medium bg-gray-50">時限</th>

                        <th key={i} className={`p-3 text-center border-l border-gray-100 ${isToday(date)?'bg-blue-50':'bg-gray-50'}`}>
                          <div className={`text-lg font-bold ${isToday(date)?'text-blue-600':'text-gray-700'}`}>{DAYS[i]}</div>

                      </React.Fragment>
                    ))}
                    <tr>
                      <td colSpan={6} className="p-0 border-t-2 border-gray-200">
                        <div className="flex items-center gap-2 px-4 py-2 bg-gray-700 text-white text-xs font-semibold tracking-wide">📝 メモ・連絡事項</div>
                        <textarea className="w-full px-4 py-3 text-sm text-gray-700 focus:outline-none focus:bg-blue-50/30 transition resize-none min-h-[96px]"
                          placeholder="メモや連絡事項を入力..."
                          value={data.memo||''} onChange={e=>patch({memo:e.target.value})}/>

              cell={getCell(modal.period,modal.dayKey)} classes={classes} subjects={subjects}
              onSave={form=>{ setCell(modal.period,modal.dayKey,form); setModal(null); }}
              onClear={()=>{ setCell(modal.period,modal.dayKey,null); setModal(null); }}
              onClose={()=>setModal(null)}/>
          )}
        </div>
      );

    // ── StatsView（授業時数集計） ──────────────────────────────
    function StatsView({ allData, settings }) {
      const [mode, setMode] = useState('class'); // 'class' | 'subject'
      const [detailClass, setDetailClass] = useState(null); // クリックしたクラス名

      // 学期ごとに集計
      const termStats = settings.terms.map((term) => {
        const weeks = getWeeksInTerm(term);
        const byClass = {}, bySubject = {}, byClassSubject = {};
        for (const wk of weeks) {
          const wd = allData[wk];
          if (!wd?.periods) continue;
          for (const period of PERIODS) {
            for (const dayKey of DAY_KEYS) {
              const cell = wd.periods[period]?.[dayKey];
              if (!cell?.className && !cell?.subject) continue;
              const cls = cell.className || '';
              const sub = cell.subject  || '';
              if (cls) byClass[cls]   = (byClass[cls]   || 0) + 1;
              if (sub) bySubject[sub] = (bySubject[sub] || 0) + 1;
              if (cls && sub) {
                if (!byClassSubject[cls]) byClassSubject[cls] = {};
                byClassSubject[cls][sub] = (byClassSubject[cls][sub] || 0) + 1;
              }
            }
          }
        }
        return { byClass, bySubject, byClassSubject };
      });

      // 表示するクラス（設定優先、なければデータから）
      const foundClasses = [...new Set(termStats.flatMap(ts => Object.keys(ts.byClass)))];
      const displayClasses = settings.myClasses.length > 0
        ? settings.myClasses.filter(c => foundClasses.includes(c)).concat(foundClasses.filter(c => !settings.myClasses.includes(c)))
        : foundClasses;

      // 表示する教科（設定優先）
      const foundSubjects = [...new Set(termStats.flatMap(ts => Object.keys(ts.bySubject)))];
      const displaySubjects = settings.mySubjects.length > 0
        ? settings.mySubjects.filter(s => foundSubjects.includes(s)).concat(foundSubjects.filter(s => !settings.mySubjects.includes(s)))
        : foundSubjects;

      // 合計
      const totalByClass   = {};
      const totalBySubject = {};
      termStats.forEach(ts => {
        Object.entries(ts.byClass).forEach(([k,v])   => { totalByClass[k]   = (totalByClass[k]   || 0) + v; });
        Object.entries(ts.bySubject).forEach(([k,v]) => { totalBySubject[k] = (totalBySubject[k] || 0) + v; });
      });

      const grandTotal = Object.values(totalByClass).reduce((s,v) => s+v, 0);

      // 数値→色の濃さ（最大値基準）
      const maxClass   = Math.max(1, ...Object.values(totalByClass));
      const maxSubject = Math.max(1, ...Object.values(totalBySubject));
      function cellBg(val, max) {
        if (!val) return '';
        const ratio = val / max;
        if (ratio >= 0.75) return 'bg-indigo-100 text-indigo-800 font-bold';
        if (ratio >= 0.40) return 'bg-indigo-50  text-indigo-700 font-semibold';
        return 'text-gray-700';
      }

      const hasData = displayClasses.length > 0 || displaySubjects.length > 0;
      const termTermStyle = ['text-blue-600','text-violet-600','text-teal-600'];
      const termBgStyle   = ['bg-blue-50',   'bg-violet-50',   'bg-teal-50'  ];

      // 詳細モーダル（クラス×教科）
      const DetailModal = ({ cls }) => {
        const subs = settings.mySubjects.length > 0 ? settings.mySubjects : displaySubjects;
        return (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4"
            onClick={e => { if (e.target===e.currentTarget) setDetailClass(null); }}>
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
              <div className="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-4 flex items-center justify-between text-white">
                <div>
                  <p className="text-indigo-200 text-xs font-semibold">クラス詳細</p>
                  <h2 className="font-bold text-lg">{cls} の教科別授業時数</h2>
                </div>
                <button onClick={() => setDetailClass(null)} className="w-8 h-8 flex items-center justify-center rounded-full hover:bg-white/20 text-xl">✕</button>
              </div>
              <div className="overflow-x-auto p-4">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-4 py-2 text-xs text-gray-400 font-semibold">教科</th>
                      {settings.terms.map((term,i) => (
                        <th key={i} className={`px-4 py-2 text-center text-xs font-bold ${termTermStyle[i]}`}>{term.name}</th>
                      ))}
                      <th className="px-4 py-2 text-center text-xs font-bold text-gray-700">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {subs.map((sub, si) => {
                      const termVals = termStats.map(ts => ts.byClassSubject?.[cls]?.[sub] || 0);
                      const total = termVals.reduce((s,v) => s+v, 0);
                      if (!total) return null;
                      const st = SUB_STYLE[sub] || {};
                      return (
                        <tr key={sub} className={si%2===0?'bg-white':'bg-gray-50/50'}>
                          <td className="px-4 py-2.5">
                            <span className={`inline-block text-xs px-2 py-0.5 rounded font-semibold ${st.badge||'bg-gray-100 text-gray-600'}`}>{sub}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className={`px-4 py-2.5 text-center tabular-nums ${v ? termTermStyle[ti] : 'text-gray-200'}`}>
                              {v || '—'}
                            </td>
                          ))}
                          <td className="px-4 py-2.5 text-center font-bold text-gray-800 tabular-nums">{total}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200">
                      <td className="px-4 py-2.5 font-bold text-gray-700 text-xs">合計</td>
                      {termStats.map((ts, ti) => (
                        <td key={ti} className={`px-4 py-2.5 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>
                          {ts.byClass[cls] || '—'}
                        </td>
                      ))}
                      <td className="px-4 py-2.5 text-center font-black text-indigo-700 tabular-nums">
                        {totalByClass[cls] || '—'}
                      </td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="max-w-5xl mx-auto py-6 px-4 space-y-5">

          {/* ── ヘッダー ── */}
          <div className="bg-white rounded-2xl shadow-lg overflow-hidden">
            <div className="bg-gradient-to-r from-indigo-700 to-indigo-500 px-6 py-4 text-white flex items-center justify-between">
              <div>
                <p className="text-indigo-200 text-xs font-semibold tracking-widest uppercase mb-0.5">Statistics</p>
                <h1 className="text-xl font-bold">授業時数集計</h1>
              </div>
              {hasData && (
                <div className="text-right">
                  <p className="text-indigo-200 text-xs">全学期 合計</p>
                  <p className="text-3xl font-black">{grandTotal}<span className="text-base font-normal ml-1 text-indigo-200">コマ</span></p>
                </div>
              )}
            </div>

            {/* モードタブ */}
            <div className="flex border-b border-gray-100">
              {[{key:'class',label:'クラス別',icon:'🏫'},{key:'subject',label:'教科別',icon:'📚'}].map(m => (
                <button key={m.key} onClick={() => { setMode(m.key); setDetailClass(null); }}
                  className={`flex-1 py-3 text-sm font-bold border-b-2 transition flex items-center justify-center gap-1.5
                    ${mode===m.key ? 'text-indigo-600 border-indigo-500' : 'text-gray-400 border-transparent hover:text-gray-600'}`}>
                  {m.icon} {m.label}
                </button>
              ))}
            </div>

            {!hasData ? (
              <div className="py-20 text-center text-gray-300">
                <div className="text-6xl mb-4">📊</div>
                <p className="font-semibold text-gray-400">週案にデータが入力されていません</p>
                <p className="text-xs mt-1 text-gray-300">週案タブでコマを登録すると、ここに集計が表示されます</p>
              </div>
            ) : mode === 'class' ? (
              /* ── クラス別テーブル ── */
              <div className="overflow-x-auto">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-5 py-3 text-xs text-gray-400 font-semibold bg-gray-50 w-28">クラス</th>
                      {settings.terms.map((term, i) => (
                        <th key={i} className={`px-4 py-3 text-center text-xs font-bold bg-gray-50 ${termTermStyle[i]}`}>
                          <div>{term.name}</div>
                          {term.start && <div className="text-gray-400 font-normal text-[10px] mt-0.5">{fmd(new Date(term.start+'T00:00:00'))}〜{fmd(new Date(term.end+'T00:00:00'))}</div>}
                        </th>
                      ))}
                      <th className="px-4 py-3 text-center text-xs font-bold text-gray-700 bg-gray-50">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {displayClasses.map((cls, ci) => {
                      const termVals = termStats.map(ts => ts.byClass[cls] || 0);
                      const total = totalByClass[cls] || 0;
                      return (
                        <tr key={cls}
                          onClick={() => setDetailClass(cls)}
                          className={`border-b border-gray-50 cursor-pointer hover:bg-indigo-50/40 transition-colors ${ci%2===0?'bg-white':'bg-gray-50/40'}`}>
                          <td className="px-5 py-3">
                            <span className="font-bold text-gray-800 text-sm">{cls}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className={`px-4 py-3 text-center tabular-nums text-sm rounded`}>
                              {v
                                ? <span className={`inline-block px-2.5 py-0.5 rounded-lg text-sm ${cellBg(v, maxClass)}`}>{v}</span>
                                : <span className="text-gray-200 text-xs">—</span>}
                            </td>
                          ))}
                          <td className="px-4 py-3 text-center">
                            <span className={`inline-block px-3 py-1 rounded-xl text-sm font-black ${total ? 'bg-indigo-100 text-indigo-700' : 'text-gray-200 text-xs'}`}>
                              {total || '—'}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200 bg-gray-50">
                      <td className="px-5 py-3 text-xs font-bold text-gray-500">合計</td>
                      {termStats.map((ts, ti) => {
                        const sum = Object.values(ts.byClass).reduce((s,v)=>s+v,0);
                        return (
                          <td key={ti} className={`px-4 py-3 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>{sum||'—'}</td>
                        );
                      })}
                      <td className="px-4 py-3 text-center font-black text-indigo-700 text-base tabular-nums">{grandTotal}</td>
                    </tr>
                  </tfoot>
                </table>
                <p className="text-xs text-gray-400 text-center py-3">クリックすると教科別の詳細が見られます</p>
              </div>
            ) : (
              /* ── 教科別テーブル ── */
              <div className="overflow-x-auto">
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="border-b-2 border-gray-100">
                      <th className="text-left px-5 py-3 text-xs text-gray-400 font-semibold bg-gray-50 w-28">教科</th>
                      {settings.terms.map((term, i) => (
                        <th key={i} className={`px-4 py-3 text-center text-xs font-bold bg-gray-50 ${termTermStyle[i]}`}>
                          <div>{term.name}</div>
                          {term.start && <div className="text-gray-400 font-normal text-[10px] mt-0.5">{fmd(new Date(term.start+'T00:00:00'))}〜{fmd(new Date(term.end+'T00:00:00'))}</div>}
                        </th>
                      ))}
                      <th className="px-4 py-3 text-center text-xs font-bold text-gray-700 bg-gray-50">合計</th>
                    </tr>
                  </thead>
                  <tbody>
                    {displaySubjects.map((sub, si) => {
                      const termVals = termStats.map(ts => ts.bySubject[sub] || 0);
                      const total = totalBySubject[sub] || 0;
                      const st = SUB_STYLE[sub] || {};
                      return (
                        <tr key={sub} className={`border-b border-gray-50 ${si%2===0?'bg-white':'bg-gray-50/40'}`}>
                          <td className="px-5 py-3">
                            <span className={`inline-block text-xs px-2.5 py-1 rounded-lg font-semibold ${st.badge||'bg-gray-100 text-gray-600'}`}>{sub}</span>
                          </td>
                          {termVals.map((v, ti) => (
                            <td key={ti} className="px-4 py-3 text-center tabular-nums text-sm">
                              {v
                                ? <span className={`inline-block px-2.5 py-0.5 rounded-lg text-sm ${cellBg(v, maxSubject)}`}>{v}</span>
                                : <span className="text-gray-200 text-xs">—</span>}
                            </td>
                          ))}
                          <td className="px-4 py-3 text-center">
                            <span className={`inline-block px-3 py-1 rounded-xl text-sm font-black ${total ? 'bg-indigo-100 text-indigo-700' : 'text-gray-200 text-xs'}`}>
                              {total || '—'}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-gray-200 bg-gray-50">
                      <td className="px-5 py-3 text-xs font-bold text-gray-500">合計</td>
                      {termStats.map((ts, ti) => {
                        const sum = Object.values(ts.bySubject).reduce((s,v)=>s+v,0);
                        return (
                          <td key={ti} className={`px-4 py-3 text-center font-bold tabular-nums ${termTermStyle[ti]}`}>{sum||'—'}</td>
                        );
                      })}
                      <td className="px-4 py-3 text-center font-black text-indigo-700 text-base tabular-nums">{grandTotal}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            )}
          </div>

          {/* ── 学期ごとの内訳カード（クラス別モード） ── */}
          {mode === 'class' && hasData && (
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              {settings.terms.map((term, ti) => {
                const ts = termStats[ti];
                const sorted = Object.entries(ts.byClass).sort((a,b)=>b[1]-a[1]);
                const sum = sorted.reduce((s,[,v])=>s+v,0);
                if (!sorted.length) return null;
                const ts_style = TERM_STYLE[ti];
                return (
                  <div key={ti} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <div className={`px-4 py-3 flex items-center gap-2 ${termBgStyle[ti]}`}>
                      <div className={`w-2 h-2 rounded-full ${ts_style.icon}`}/>
                      <span className={`text-sm font-bold ${termTermStyle[ti]}`}>{term.name}</span>
                      <span className={`ml-auto text-xs font-semibold ${termTermStyle[ti]}`}>{sum}コマ</span>
                    </div>
                    <div className="p-3 space-y-1.5">
                      {sorted.map(([cls, cnt]) => (
                        <div key={cls}
                          onClick={() => setDetailClass(cls)}
                          className="flex items-center gap-2 group cursor-pointer">
                          <span className="text-xs font-bold text-gray-700 w-12 shrink-0">{cls}</span>
                          <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                            <div className={`h-2 rounded-full transition-all ${ts_style.icon}`}
                              style={{width:`${Math.round(cnt/sorted[0][1]*100)}%`}}/>
                          </div>
                          <span className="text-xs font-bold text-gray-600 tabular-nums w-8 text-right">{cnt}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {detailClass && <DetailModal cls={detailClass}/>}
        </div>
      );
    }

    // ── App ────────────────────────────────────────────────────
    function App() {
      const [view,       setView      ] = useState('main');
      const [settings,   setSettings  ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanSettings'); return s?{...DEFAULT_SETTINGS,...JSON.parse(s)}:DEFAULT_SETTINGS; }
        catch { return DEFAULT_SETTINGS; }
      });
      const [annualData, setAnnualData] = useState(() => {
        try { const s=localStorage.getItem('weekPlanAnnual'); return s?{...DEFAULT_ANNUAL,...JSON.parse(s)}:DEFAULT_ANNUAL; }
        catch { return DEFAULT_ANNUAL; }
      });
      const [timetable,  setTimetable ] = useState(() => {
        try { const s=localStorage.getItem('weekPlanTimetable'); return s?{...DEFAULT_TIMETABLE,...JSON.parse(s)}:DEFAULT_TIMETABLE; }
        catch { return DEFAULT_TIMETABLE; }
      });
      const [allData,    setAllData   ] = useState(() => {
        try { return JSON.parse(localStorage.getItem('weekPlanData')||'{}'); }
        catch { return {}; }
      });

      useEffect(() => { localStorage.setItem('weekPlanSettings',  JSON.stringify(settings));   }, [settings]);
      useEffect(() => { localStorage.setItem('weekPlanAnnual',    JSON.stringify(annualData));  }, [annualData]);
      useEffect(() => { localStorage.setItem('weekPlanTimetable', JSON.stringify(timetable));   }, [timetable]);
      useEffect(() => { localStorage.setItem('weekPlanData',      JSON.stringify(allData));     }, [allData]);

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col">
          <TopNav view={view} setView={setView} ready={isSettingsReady(settings)}/>
          {view==='main'
            ? <WeeklyPlanView settings={settings} annualData={annualData} setView={setView} allData={allData} setAllData={setAllData}/>
            : view==='timetable'
            ? <TimetableView timetable={timetable} setTimetable={setTimetable} settings={settings} allData={allData} setAllData={setAllData}/>
            : view==='annual'
            ? <AnnualView annualData={annualData} setAnnualData={setAnnualData}/>
            : view==='stats'
            ? <StatsView allData={allData} settings={settings}/>
            : <SettingsView settings={settings} onSave={setSettings}/>
          }
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
